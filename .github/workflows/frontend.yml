name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy or inspect QNAP without changing containers
        type: choice
        options:
          - deploy
          - inspect
        default: deploy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A running production deployment must finish or perform its rollback.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check diff whitespace
        run: git diff --check HEAD^ HEAD
        working-directory: .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check lint and architecture boundaries
        run: npm run lint
      - name: Check frontend formatting
        run: npm run format:check
      - name: Check workflow formatting
        run: npx prettier --check '../.github/workflows/*.{yml,yaml}' '../deploy/qnap-compose.yml'
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run frontend unit and architecture tests
        run: npm run test:unit
      - name: Run component and accessibility tests
        run: npm run test:component
      - name: Build frontend
        run: npm run build
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run backend tests and build the application JAR
        run: mvn -B clean package
        working-directory: .
      - name: Run deployment regression tests
        run: |
          sh -n deploy/qnap-deploy.sh
          sh -n deploy/qnap-inspect.sh
          bash -n deploy/connect-qnap.sh
          bash -n deploy/test-image.sh
          python3 -m unittest discover -s deploy/test -v
          docker compose -p savingsapp -f deploy/qnap-compose.yml config --quiet
        working-directory: .
      - name: Build and smoke-test the deployment image
        run: |
          cp backend/target/app-*.jar deploy/image/app.jar
          docker build -t savingsapp-ci --file deploy/image/Dockerfile deploy/image
          bash deploy/test-image.sh savingsapp-ci
        working-directory: .
      - name: Upload the verified application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: backend/target/app-*.jar
          if-no-files-found: error
          retention-days: 7
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:browser
      - name: Upload test reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            backend/target/surefire-reports/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.QNAP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: verified-jar
      - name: Prepare the verified JAR and image name
        id: image
        run: |
          cp verified-jar/app-*.jar deploy/image/app.jar
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested application for x86 and ARM64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: qnap
    permissions:
      contents: read
      packages: read
    concurrency:
      group: qnap-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Join the private Tailscale network
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:savingsapp-ci
      - name: Back up data and deploy on QNAP
        run: bash deploy/connect-qnap.sh
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QNAP_HOST: ${{ vars.QNAP_HOST }}
          QNAP_SSH_USER: ${{ vars.QNAP_SSH_USER }}
          QNAP_SSH_PORT: ${{ vars.QNAP_SSH_PORT }}
          QNAP_COMPOSE_FILE: ${{ vars.QNAP_COMPOSE_FILE }}
          QNAP_COMPOSE_RESOURCE_FILE: ${{ vars.QNAP_COMPOSE_RESOURCE_FILE }}
          QNAP_COMPOSE_PROJECT: ${{ vars.QNAP_COMPOSE_PROJECT }}
          QNAP_COMPOSE_SERVICE: ${{ vars.QNAP_COMPOSE_SERVICE }}
          QNAP_DOCKER_BIN: ${{ vars.QNAP_DOCKER_BIN }}
          QNAP_SSH_PRIVATE_KEY: ${{ secrets.QNAP_SSH_PRIVATE_KEY }}
          QNAP_SSH_KNOWN_HOSTS: ${{ secrets.QNAP_SSH_KNOWN_HOSTS }}

  inspect-qnap:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: qnap
    steps:
      - uses: actions/checkout@v4
      - name: Join the private Tailscale network
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:savingsapp-ci
      - name: Inspect QNAP configuration without deploying
        run: bash deploy/connect-qnap.sh
        env:
          QNAP_OPERATION: inspect
          QNAP_CONTAINER: ${{ vars.QNAP_CONTAINER || 'savingsapp-1' }}
          QNAP_HOST: ${{ vars.QNAP_HOST }}
          QNAP_SSH_USER: ${{ vars.QNAP_SSH_USER }}
          QNAP_SSH_PORT: ${{ vars.QNAP_SSH_PORT }}
          QNAP_DOCKER_BIN: ${{ vars.QNAP_DOCKER_BIN }}
          QNAP_SSH_PRIVATE_KEY: ${{ secrets.QNAP_SSH_PRIVATE_KEY }}
          QNAP_SSH_KNOWN_HOSTS: ${{ secrets.QNAP_SSH_KNOWN_HOSTS }}
