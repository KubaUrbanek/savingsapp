spring.application.name=oszczednosci-app
server.port=8080

app.database.file=./backend/data/investment-entries.json

# Production denies cross-origin browser calls unless origins are explicitly configured.
app.web.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Set stable secrets in deployment. Random defaults keep an unconfigured instance closed.
app.security.reader.username=${APP_READER_USERNAME:reader}
app.security.reader.password=${APP_READER_PASSWORD:${random.uuid}}
app.security.administrator.username=${APP_ADMIN_USERNAME:administrator}
app.security.administrator.password=${APP_ADMIN_PASSWORD:${random.uuid}}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
