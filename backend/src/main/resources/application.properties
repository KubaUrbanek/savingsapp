spring.application.name=oszczednosci-app
server.port=8080

# H2 database path without the .mv.db extension; keep its directory on persistent storage.
app.database.path=./backend/data/portfolio

# Production denies cross-origin browser calls unless origins are explicitly configured.
app.web.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
